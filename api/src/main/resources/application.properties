spring.application.name=instituto-mao-amiga-api
server.port=8085

# Banco H2 gravado em arquivo (pasta api/data), os dados ficam salvos entre reinícios.
spring.datasource.url=jdbc:h2:file:./data/institutodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Quantidade 1.5 no JSON responde 400 em vez de virar 1.
spring.jackson.deserialization.accept-float-as-int=false
